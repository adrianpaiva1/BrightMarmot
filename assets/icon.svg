    <ellipse cx="118" cy="196" rx="34" ry="24" fill="#E8BC85"/>
    <ellipse cx="96" cy="158" rx="13" ry="17" fill="#1E120A"/>
    <circle cx="101" cy="151" r="5" fill="#fff"/>
