    <linearGradient id="beam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1E2740"/>
  <g clip-path="url(#badge)">
