    <circle cx="224" cy="200" r="3" fill="#fff" opacity=".6"/>
    <polygon points="196,176 150,0 256,0 256,56" fill="url(#beam)"/>
    <circle cx="66" cy="132" r="16" fill="#A86F3E" stroke="#3A2313" stroke-width="7"/>
